<svg width="660" height="110" viewBox="0 0 660 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="node-grad2" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4dffc8"/>
      <stop offset="100%" stop-color="#00c47a"/>
    </radialGradient>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blurred"/>
      <feMerge><feMergeNode in="blurred"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-ai" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blurred"/>
      <feMerge><feMergeNode in="blurred"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── ICON MARK ── -->
  <!-- T crossbar -->
  <rect x="18" y="50" width="58" height="10" rx="3" fill="#f1f5f9"/>
  <!-- T stem -->
  <rect x="42" y="50" width="10" height="38" rx="3" fill="#f1f5f9"/>
  <!-- Connector -->
  <line x1="47" y1="41" x2="47" y2="50" stroke="#00e5a0" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2"/>

  <!-- Node outer glow — animated pulse -->
  <circle cx="47" cy="35" r="16" fill="#00e5a0" filter="url(#glow2)">
    <animate attributeName="opacity" values="0.12;0.32;0.12" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="16;22;16" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Node mid glow — offset pulse -->
  <circle cx="47" cy="35" r="9" fill="#00e5a0">
    <animate attributeName="opacity" values="0.2;0.42;0.2" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Node core -->
  <circle cx="47" cy="35" r="6" fill="url(#node-grad2)" filter="url(#glow2)">
    <animate attributeName="r" values="6;7;6" dur="2.8s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="47" cy="35" r="2.5" fill="#05050e"/>
  <circle cx="47" cy="35" r="1.2" fill="#00e5a0"/>
  <circle cx="44" cy="33" r="1.2" fill="white" opacity="0.4"/>

  <!-- Divider -->
  <line x1="94" y1="22" x2="94" y2="88" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>

  <!-- ── WORDMARK ── -->
  <style>
    .wm { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .wm-tag { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
  </style>

  <!-- TREV' -->
  <text x="108" y="72" class="wm" font-size="46" fill="#f1f5f9" letter-spacing="1.5">TREV&apos;</text>

  <!-- AI (green, animated glow) -->
  <text x="280" y="72" class="wm" font-size="46" fill="#00e5a0" letter-spacing="1.5" filter="url(#glow-ai)">
    AI
    <animate attributeName="opacity" values="1;0.7;1" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
  </text>

  <!-- NNOVATE -->
  <text x="348" y="72" class="wm" font-size="46" fill="#f1f5f9" fill-opacity="0.88" letter-spacing="1.5">NNOVATE</text>

  <!-- Tagline -->
  <text x="109" y="95" class="wm-tag" font-size="11" fill="#8892a4" letter-spacing="2">El siguiente nivel de tu negocio.</text>
</svg>
