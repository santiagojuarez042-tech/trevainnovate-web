name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -D wrangler

      - name: Deploy
        run: npx wrangler pages deploy . --project-name=trevainnovate --commit-dirty=true
        env:
          # Usamos los nombres exactos que tienes en tus Secrets
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CF_MAIL }}
          CLOUDFLARE_ACCOUNT_ID: "21975dec590b6bf41f0c59d007f0251e"
