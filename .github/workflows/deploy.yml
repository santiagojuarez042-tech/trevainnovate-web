name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -D wrangler

      - name: Deploy
        # Eliminamos por completo el paso de autenticación implícito
        # y usamos --account-id directo en el comando
        run: |
          npx wrangler pages deploy . \
          --project-name=trevainnovate \
          --branch=main \
          --account-id=21975dec590b6bf41f0c59d007f0251e \
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
