name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install -D wrangler

      - name: Deploy
        # Usamos CLOUDFLARE_API_TOKEN directamente delante del comando
        run: |
          npx wrangler pages deploy . --project-name=trevainnovate --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "21975dec590b6bf41f0c59d007f0251e"
