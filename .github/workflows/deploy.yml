name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Este paso instala la versión más reciente de Wrangler (v4+)
      # Esto soluciona el 'exit code 1' cuando wrangler-action intenta usar una versión antigua
      - name: Install Wrangler latest
        run: npm install -D wrangler@latest

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=trevainnovate --branch=main --commit-dirty=true
