name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -D wrangler

      - name: Debug and Deploy
        run: |
          npx wrangler whoami
          npx wrangler pages deploy . --project-name=trevainnovate --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # No incluimos CLOUDFLARE_ACCOUNT_ID por ahora para ver qué cuenta detecta 'whoami'
