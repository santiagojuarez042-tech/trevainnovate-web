<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#111128"/>
      <stop offset="100%" stop-color="#05050e"/>
    </radialGradient>
    <radialGradient id="node-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4dffc8"/>
      <stop offset="100%" stop-color="#00c47a"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blurred"/>
      <feMerge>
        <feMergeNode in="blurred"/>
        <feMergeNode in="blurred"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="t-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blurred"/>
      <feMerge>
        <feMergeNode in="blurred"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="400" height="400" rx="72" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="400" height="400" rx="72" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06"/>

  <!-- T crossbar -->
  <rect x="106" y="192" width="188" height="28" rx="7" fill="#f1f5f9" filter="url(#t-glow)"/>
  <!-- T stem -->
  <rect x="186" y="192" width="28" height="118" rx="7" fill="#f1f5f9" filter="url(#t-glow)"/>

  <!-- Connector line node → T -->
  <line x1="200" y1="167" x2="200" y2="192"
        stroke="#00e5a0" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="4 3"/>

  <!-- Node outer glow (large, very soft) -->
  <circle cx="200" cy="148" r="52" fill="#00e5a0" opacity="0.08" filter="url(#glow)"/>
  <!-- Node mid glow -->
  <circle cx="200" cy="148" r="30" fill="#00e5a0" opacity="0.14"/>
  <!-- Node main -->
  <circle cx="200" cy="148" r="19" fill="url(#node-grad)" filter="url(#glow)"/>
  <!-- Node inner ring -->
  <circle cx="200" cy="148" r="8" fill="#05050e"/>
  <!-- Node center dot -->
  <circle cx="200" cy="148" r="3.5" fill="#00e5a0"/>
  <!-- Node highlight -->
  <circle cx="194" cy="143" r="3" fill="white" opacity="0.45"/>
</svg>
